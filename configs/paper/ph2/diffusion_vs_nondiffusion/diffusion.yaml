# PH2, diffusion model of the matched comparison with the non-diffusion counterpart (Ablation study):
# MLFFM-SegDiff trained for 1,000 epochs with batch size 12, a constant learning rate and no EMA;
# the final-epoch checkpoint is tested. Same settings as nondiffusion.yaml where the paradigm allows.
run:
  device: cuda
  save_imgs: saved_imgs
  writer_dir: outputs/paper/ph2/diffusion_vs_nondiffusion/diffusion/runs
  continue_training: false
  task: diffusion
  kfold:
    enabled: true
    n_splits: 5
    shuffle: true
    seed: 0
    metrics_dir: outputs/paper/ph2/diffusion_vs_nondiffusion/diffusion/metrics
    config_dir: outputs/paper/ph2/diffusion_vs_nondiffusion/diffusion/configs
  log_dir: outputs/paper/ph2/diffusion_vs_nondiffusion/diffusion/logs
model:
  save_dir: outputs/paper/ph2/diffusion_vs_nondiffusion/diffusion/models
  name: mlffm_diff_b12
  class: MLFFMSegDiff
  params:
    dim_x: 128
    dim_g: 64
    channels_x: 1
    channels_g: 3
    out_dim: 1
    dim_x_mults:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    dim_g_mults:
    - 1
    - 2
    - 4
    - 8
    - 16
    - 32
    resnet_block_groups: 8
diffusion:
  schedule:
    timesteps: 250
    mode: linear
    beta_start: 0.0004
    beta_end: 0.08
dataset:
  input_size: 128
  name: ph2
  class_name: PH2DatasetFast
  data_dir: data/ph2
  number_classes: 2
  img_channels: 3
  msk_channels: 1
data_loader:
  train:
    batch_size: 12
    shuffle: true
    pin_memory: true
  validation:
    batch_size: 12
    shuffle: false
    pin_memory: true
  test:
    batch_size: 12
    shuffle: false
    pin_memory: false
training:
  epochs: 1000
  intial_weights:
    use: false
    file_path: path/to/file
  loss:
    l2:
      cofficient: 1.0
    boundary:
      cofficient: 0.25
      params:
        gamma: 0.25
        root: l2
  optimizer:
    name: Adam
    params:
      lr: 0.0001
      betas:
      - 0.7
      - 0.99
      weight_decay: 0.0
  scheduler:
    factor: 0.5
    patience: 9
  ema:
    use: false
    params:
      beta: 0.9999
      update_after_step: 500
      update_every: 1
      inv_gamma: 1.0
      power: 0.9
  save_every: 50
testing:
  ensemble: 5
  model_weigths:
    overload: false
    file_path: path/to/file
  result_imgs:
    save: false
    dir: outputs/paper/ph2/diffusion_vs_nondiffusion/diffusion/result_imgs
  clip_x0: false
  seed: 0
augmentation:
  p: 0.5
  levels:
    pixel:
      p: 1.0
      transforms:
        CLAHE:
          clip_limit: 4
          tile_grid_size:
          - 3
          - 3
          p: 0.05
        Emboss:
          p: 0.05
        GaussNoise:
          var_limit:
          - 10
          - 200
          p: 0.05
        HueSaturationValue:
          hue_shift_limit: 7
          sat_shift_limit: 30
          val_shift_limit: 20
          p: 0.05
        MultiplicativeNoise:
          multiplier:
          - 0.8
          - 1.25
          elementwise: true
          p: 0.05
        RGBShift:
          p: 0.05
        RandomBrightnessContrast:
          p: 0.05
        RandomGamma:
          gamma_limit:
          - 70
          - 130
          p: 0.05
        RandomToneCurve:
          scale: 0.15
          p: 0.05
        Sharpen:
          p: 0.05
        Spatter:
          mean: 0
          std: 60
          gauss_sigma: 2
          cutout_threshold: 5
          intensity: -3
          p: 0.05
        UnsharpMask:
          p: 0.05
    spacial:
      p: 1
      transforms:
        Affine:
          p: 0.05
        CoarseDropout:
          min_holes: 1
          max_holes: 5
          min_height: 4
          max_height: 16
          min_width: 4
          max_width: 16
          fill_value:
          - 10
          - 20
          - 60
          p: 0.05
        ElasticTransform:
          alpha: 0.5
          sigma: 1.3
          alpha_affine: 20
          border_mode: 2
          p: 0.05
        HorizontalFlip:
          p: 0.05
        VerticalFlip:
          p: 0.05
        Flip:
          p: 0.05
        GridDistortion:
          border_mode: 4
          p: 0.05
        PiecewiseAffine:
          p: 0.05
        PixelDropout:
          p: 0.05
        RandomRotate90:
          p: 0.05
        Rotate:
          border_mode: 4
          p: 0.05
